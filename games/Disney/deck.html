<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gToons - My Deck</title>
    <style>
        :root { 
            --p: #3b82f6; --s: #f59e0b; --bg: #0b0e14; 
            --red: #ef4444; --blue: #3b82f6; --green: #22c55e;
            --yellow: #eab308; --purple: #a855f7; --orange: #f97316;
            --pink: #ec4899; --cyan: #06b6d4; --silver: #94a3b8; --gold: #d97706;
        }

        body { 
            background: var(--bg); color: white; font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; padding-bottom: 50px;
        }

        /* Navigation */
        .nav { display: flex; justify-content: space-around; background: #000; padding: 15px; border-bottom: 2px solid var(--p); position: sticky; top: 0; z-index: 100; }
        .nav a { color: white; text-decoration: none; font-weight: bold; font-size: 0.9rem; opacity: 0.7; }
        .nav a.active { color: var(--s); opacity: 1; }

        .header { padding: 30px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 1.8rem; letter-spacing: 2px; color: var(--s); }
        .stats { font-size: 0.9rem; color: #94a3b8; margin-top: 10px; }

        /* Card Grid */
        .deck-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 20px; 
            padding: 0 20px;
            max-width: 1000px;
            margin: auto;
        }

        /* Circular Coin Style */
        .card {
            aspect-ratio: 1 / 1;
            border-radius: 50%; /* Makes it circular */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 6px solid rgba(255,255,255,0.2); /* Thicker border like a coin edge */
            transition: transform 0.2s;
            overflow: hidden;
            box-shadow: 0 8px 15px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.2);
        }
        
        .card:hover { transform: scale(1.05); }

        /* Shine Effect */
        .card::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
        }

        .card-power {
            font-size: 2.4rem;
            font-weight: 900;
            line-height: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 2;
        }

        .card-name {
            font-size: 0.65rem;
            font-weight: 800;
            text-align: center;
            padding: 0 15px;
            margin-top: 2px;
            text-transform: uppercase;
            z-index: 2;
            max-width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-tag {
            position: absolute;
            top: 15%;
            font-size: 0.55rem;
            letter-spacing: 1px;
            font-weight: bold;
            opacity: 0.8;
            z-index: 2;
        }

        /* Element Backgrounds */
        .red { background: radial-gradient(circle, #ef4444, #7f1d1d); }
        .blue { background: radial-gradient(circle, #3b82f6, #1e3a8a); }
        .green { background: radial-gradient(circle, #22c55e, #14532d); }
        .yellow { background: radial-gradient(circle, #eab308, #854d0e); color: #000; }
        .purple { background: radial-gradient(circle, #a855f7, #581c87); }
        .orange { background: radial-gradient(circle, #f97316, #7c2d12); }
        .pink { background: radial-gradient(circle, #ec4899, #831843); }
        .cyan { background: radial-gradient(circle, #06b6d4, #164e63); }
        .silver { background: radial-gradient(circle, #94a3b8, #334155); }
        .gold { background: radial-gradient(circle, #d97706, #78350f); border-color: #facc15; }

        .empty-state { text-align: center; padding: 100px 20px; color: #475569; }
        .btn-go { display: inline-block; margin-top: 20px; padding: 12px 25px; background: var(--p); color: white; text-decoration: none; border-radius: 25px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="nav">
        <a href="deck.html" class="active">MY DECK</a>
        <a href="collect.html">SCANNER</a>
        <a href="battle.html">BATTLE</a>
    </div>

    <div class="header">
        <h1 id="deck-title">MY COLLECTION</h1>
        <div class="stats" id="deck-stats">0 Coins | 0 Total Power</div>
    </div>

    <div id="deck-container" class="deck-grid"></div>

    <div id="empty-msg" class="empty-state" style="display: none;">
        <p>Your deck is empty!</p>
        <a href="collect.html" class="btn-go">GO SCAN RIDES</a>
    </div>

<script>
    function loadDeck() {
        const inventory = JSON.parse(localStorage.getItem('gToonCollection') || '[]');
        const container = document.getElementById('deck-container');
        const stats = document.getElementById('deck-stats');
        const emptyMsg = document.getElementById('empty-msg');

        if (inventory.length === 0) {
            emptyMsg.style.display = 'block';
            container.innerHTML = '';
            stats.innerText = "0 Coins | 0 Total Power";
            return;
        }

        emptyMsg.style.display = 'none';
        
        let totalPower = 0;
        let html = '';

        // Sort by power (strongest first)
        inventory.sort((a, b) => b.power - a.power);

        inventory.forEach(coin => {
            totalPower += coin.power;
            html += `
                <div class="card ${coin.color}">
                    <div class="card-tag">${coin.color.toUpperCase()}</div>
                    <div class="card-power">${coin.power}</div>
                    <div class="card-name">${coin.char}</div>
                </div>
            `;
        });

        container.innerHTML = html;
        stats.innerText = `${inventory.length} Coins | ${totalPower} Total Power`;
    }

    window.onload = loadDeck;
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'visible') loadDeck();
    });
</script>
</body>
</html>
