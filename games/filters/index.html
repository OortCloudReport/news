<!DOCTYPE html>
<html>
<head>
    <title>My Custom Guava Filter Recorder</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        #container { position: relative; width: 640px; height: 480px; margin: 20px auto; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        video, canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; }
        .controls { margin-top: 20px; }
        button { font-size: 16px; font-weight: bold; padding: 12px 24px; margin: 10px; cursor: pointer; border-radius: 6px; border: none; transition: 0.2s; }
        #start { background: #00ca71; color: white; }
        #start:disabled { background: #444; color: #888; cursor: not-allowed; }
        #stop { background: #ff3b30; color: white; }
        #stop:disabled { background: #444; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Guava Filter Studio</h1>
    <div id="container">
        <!-- Hidden video element feeds raw data to the canvas template directly -->
        <video id="webcam" autoplay playsinline muted style="display:none;"></video>
        <canvas id="output"></canvas>
    </div>
    <div class="controls">
        <button id="start">Record</button>
        <button id="stop" disabled>Stop Recording</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start');
        const stopBtn = document.getElementById('stop');
        
        let mediaRecorder;
        let recordedChunks = [];

        const guavaImg = new Image();
        guavaImg.src = 'guava.png'; 

        navigator.mediaDevices.getUserMedia({ 
            video: { width: 640, height: 480 }, 
            audio: true 
        })
        .then(stream => {
            video.srcObject = stream;
            video.addEventListener('loadedmetadata', () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                drawFilter();
            });

            const canvasStream = canvas.captureStream(30); 
            const audioTracks = stream.getAudioTracks();
            if(audioTracks.length > 0) {
                canvasStream.addTrack(audioTracks[0]);
            }

            mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp8,opus' });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'guava-performance.webm';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };
        })
        .catch(err => {
            console.error("Camera configuration system status:", err);
        });

        // Grabs an exact area of the raw video camera and places it on top of the fruit
        function copyFacialFeature(camX, camY, radius, placementX, placementY) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(placementX, placementY, radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            
            // Map video area directly onto the guava surface coordinates
            ctx.drawImage(video, camX - radius, camY - radius, radius * 2, radius * 2, placementX - radius, placementY - radius, radius * 2, radius * 2);
            ctx.restore();
        }

        function drawFilter() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Draw your live background scene unmodified
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Solid fruit layout matrix settings
            const maskW = 340;
            const maskH = 340;
            const maskX = (canvas.width / 2) - (maskW / 2);
            const maskY = (canvas.height / 2) - (maskH / 2) + 20;

            // 2. Overlay your completely solid guava file over the center
            ctx.drawImage(guavaImg, maskX, maskY, maskW, maskH);

            // 3. Extract your features from the canvas feed center and paste them over the guava
            // Target coordinates adjusted to align perfectly with your facial center
            const faceCenterX = canvas.width / 2;
            const faceCenterY = canvas.height / 2 - 15;

            // Paste Left Eye
            copyFacialFeature(faceCenterX - 45, faceCenterY - 30, 24, maskX + 115, maskY + 165);
            
            // Paste Right Eye
            copyFacialFeature(faceCenterX + 45, faceCenterY - 30, 24, maskX + 225, maskY + 165);
            
            // Paste Mouth
            copyFacialFeature(faceCenterX, faceCenterY + 55, 34, maskX + 170, maskY + 245);

            requestAnimationFrame(drawFilter);
        }
    </script>
</body>
</html>
