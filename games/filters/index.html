<!DOCTYPE html>
<html>
<head>
    <title>My Custom Guava Filter Recorder</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        #container { position: relative; width: 640px; height: 480px; margin: 20px auto; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        video, canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; transform: scaleX(-1); }
        .controls { margin-top: 20px; }
        button { font-size: 16px; font-weight: bold; padding: 12px 24px; margin: 10px; cursor: pointer; border-radius: 6px; border: none; transition: 0.2s; }
        #start { background: #00ca71; color: white; }
        #start:disabled { background: #444; color: #888; cursor: not-allowed; }
        #stop { background: #ff3b30; color: white; }
        #stop:disabled { background: #444; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Guava Filter Studio</h1>
    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output"></canvas>
    </div>
    <div class="controls">
        <button id="start">Record</button>
        <button id="stop" disabled>Stop Recording</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start');
        const stopBtn = document.getElementById('stop');
        
        let mediaRecorder;
        let recordedChunks = [];

        const guavaImg = new Image();
        guavaImg.src = 'guava.png'; 

        navigator.mediaDevices.getUserMedia({ 
            video: { width: 640, height: 480 }, 
            audio: true 
        })
        .then(stream => {
            video.srcObject = stream;
            video.addEventListener('loadedmetadata', () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                drawFilter();
            });

            const canvasStream = canvas.captureStream(30); 
            const audioTracks = stream.getAudioTracks();
            if(audioTracks.length > 0) {
                canvasStream.addTrack(audioTracks[0]);
            }

            mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp8,opus' });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'guava-performance.webm';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };
        })
        .catch(err => {
            alert("Camera Access Error");
            console.error(err);
        });

        function drawFilter() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Draw your live webcam view as the base layer
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Set position parameters for the fruit overlay
            const maskW = 340;
            const maskH = 340;
            const maskX = (canvas.width / 2) - (maskW / 2);
            const maskY = (canvas.height / 2) - (maskH / 2);

            // 2. Create a temporary layout path to isolate eye and mouth cutouts
            ctx.save();
            ctx.beginPath();
            
            // Left Eye Hole (X-offset, Y-offset, radius)
            ctx.arc(maskX + 115, maskY + 125, 28, 0, Math.PI * 2); 
            // Right Eye Hole
            ctx.arc(maskX + 225, maskY + 125, 28, 0, Math.PI * 2); 
            // Mouth Hole
            ctx.arc(maskX + 170, maskY + 230, 40, 0, Math.PI * 2); 
            ctx.closePath();
            
            // Clip context to exclude those areas from the upcoming image draw
            ctx.clip();
            
            // Fill background underneath holes so webcam stays seamlessly visible
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            // 3. Draw the main Guava image overlay properly over the live layer
            ctx.save();
            
            // Define hole tracking matrix regions
            ctx.beginPath();
            ctx.rect(0, 0, canvas.width, canvas.height);
            // Counter-clockwise paths for cutting holes *out* of an image mask layer
            ctx.arc(maskX + 115, maskY + 125, 28, 0, Math.PI * 2, true); 
            ctx.arc(maskX + 225, maskY + 125, 28, 0, Math.PI * 2, true); 
            ctx.arc(maskX + 170, maskY + 230, 40, 0, Math.PI * 2, true); 
            ctx.closePath();
            ctx.clip();
            
            // Draw your custom file directly inside the safe visibility canvas zone
            ctx.drawImage(guavaImg, maskX, maskY, maskW, maskH);
            ctx.restore();

            requestAnimationFrame(drawFilter);
        }
    </script>
</body>
</html>
