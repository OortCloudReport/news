<!DOCTYPE html>
<html>
<head>
    <title>Guava 5 Filter Studio</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        .workspace { display: flex; justify-content: center; gap: 20px; align-items: flex-start; margin: 20px auto; max-width: 1100px; }
        #container { position: relative; width: 640px; height: 480px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); background: black; }
        canvas { width: 640px; height: 480px; }
        .sidebar { background: #2a2a2a; padding: 20px; border-radius: 8px; text-align: left; width: 320px; }
        video { width: 320px; height: 240px; background: #000; border-radius: 4px; margin-bottom: 15px; }
        .controls { margin-top: 20px; }
        button { font-size: 16px; font-weight: bold; padding: 12px 24px; margin: 10px; cursor: pointer; border-radius: 6px; border: none; }
        #start { background: #00ca71; color: white; }
        #stop { background: #ff3b30; color: white; }
        label { display: block; font-size: 12px; margin: 10px 0 5px 0; font-weight: bold; }
        input[type="range"] { width: 100%; }
    </style>
</head>
<body>
    <h1>Guava Filter Studio</h1>
    
    <div class="workspace">
        <!-- Main Recording Canvas -->
        <div id="container">
            <canvas id="output"></canvas>
        </div>

        <!-- Calibration Sidebar -->
        <div class="sidebar">
            <h3>1. See Your Webcam Here:</h3>
            <video id="webcam" autoplay playsinline muted></video>
            
            <h3>2. Adjust Sliders to Copy Eyes/Mouth:</h3>
            <label>Face Left / Right</label>
            <input type="range" id="faceX" min="40" max="600" value="320">

            <label>Face Up / Down</label>
            <input type="range" id="faceY" min="40" max="440" value="240">

            <label>Eye Spacing (Widen/Narrow)</label>
            <input type="range" id="eyeDist" min="20" max="100" value="50">
        </div>
    </div>

    <div class="controls">
        <button id="start">Record</button>
        <button id="stop" disabled>Stop Recording</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start');
        const stopBtn = document.getElementById('stop');
        
        const faceXSlider = document.getElementById('faceX');
        const faceYSlider = document.getElementById('faceY');
        const eyeDistSlider = document.getElementById('eyeDist');
        
        let mediaRecorder;
        let recordedChunks = [];

        const guavaImg = new Image();
        guavaImg.src = 'guava.png'; 

        // Start Webcam Feed
        navigator.mediaDevices.getUserMedia({ 
            video: { width: 640, height: 480 }, 
            audio: true 
        })
        .then(stream => {
            video.srcObject = stream;
            video.addEventListener('loadedmetadata', () => {
                canvas.width = 640;
                canvas.height = 480;
                drawFilter();
            });

            // Set up recording output link
            const canvasStream = canvas.captureStream(30); 
            const audioTracks = stream.getAudioTracks();
            if(audioTracks.length > 0) canvasStream.addTrack(audioTracks);

            mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp8,opus' });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'guava-video.webm';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };
        });

        function drawFilter() {
            // LAYER 1: Draw a completely solid black background block
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Fixed Guava Placement Box (Guava is drawn 100% solid, untouched)
            const gW = 340; const gH = 340;
            const gX = (canvas.width / 2) - (gW / 2);
            const gY = (canvas.height / 2) - (gH / 2) + 20;

            // LAYER 2: Draw the solid guava image onto the black background
            ctx.drawImage(guavaImg, gX, gY, gW, gH);

            // Read your current slider settings
            const camX = parseInt(faceXSlider.value);
            const camY = parseInt(faceYSlider.value);
            const eyeGap = parseInt(eyeDistSlider.value);

            // LAYER 3: Pure Copy & Paste square snapshots directly on top of the fruit
            // No masking, no clipping paths, no hole cutting allowed.
            
            // Copy Left Eye square from your face and stamp onto guava face area
            ctx.drawImage(video, camX - eyeGap - 20, camY - 20, 40, 40, gX + 95, gY + 145, 40, 40);
            
            // Copy Right Eye square from your face and stamp onto guava face area
            ctx.drawImage(video, camX + eyeGap - 20, camY - 20, 40, 40, gX + 205, gY + 145, 40, 40);
            
            // Copy Mouth square from your face and stamp onto guava face area
            ctx.drawImage(video, camX - 30, camY + 40, 60, 45, gX + 140, gY + 225, 60, 45);

            requestAnimationFrame(drawFilter);
        }

        startBtn.onclick = () => {
            recordedChunks = [];
            mediaRecorder.start();
            startBtn.disabled = true;
            stopBtn.disabled = false;
        };
        stopBtn.onclick = () => {
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
        };
    </script>
</body>
</html>
