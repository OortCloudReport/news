<!DOCTYPE html>
<html>
<head>
    <title>Guava 4 Filter Studio</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        #container { position: relative; width: 640px; height: 480px; margin: 20px auto; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); background: black; }
        canvas { width: 640px; height: 480px; background: black; }
        .controls { margin-top: 20px; }
        button { font-size: 16px; font-weight: bold; padding: 12px 24px; margin: 10px; cursor: pointer; border-radius: 6px; border: none; }
        #start { background: #00ca71; color: white; }
        #start:disabled { background: #444; color: #888; }
        #stop { background: #ff3b30; color: white; }
        #stop:disabled { background: #444; color: #888; }
        .sliders { display: flex; justify-content: center; gap: 20px; margin: 20px auto; max-width: 600px; background: #2a2a2a; padding: 15px; border-radius: 8px; }
        label { display: block; font-size: 12px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h1>Guava Filter Studio</h1>
    
    <div id="container">
        <!-- Kept active for browser processing stream data, visually hidden from screen -->
        <video id="webcam" autoplay playsinline muted style="display:none;"></video>
        <canvas id="output"></canvas>
    </div>

    <div class="sliders">
        <div>
            <label>Face Left/Right</label>
            <input type="range" id="faceX" min="50" max="590" value="320">
        </div>
        <div>
            <label>Face Up/Down</label>
            <input type="range" id="faceY" min="50" max="430" value="240">
        </div>
        <div>
            <label>Eye Spacing</label>
            <input type="range" id="eyeDist" min="20" max="120" value="55">
        </div>
    </div>

    <div class="controls">
        <button id="start">Record</button>
        <button id="stop" disabled>Stop Recording</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start');
        const stopBtn = document.getElementById('stop');
        
        const faceXSlider = document.getElementById('faceX');
        const faceYSlider = document.getElementById('faceY');
        const eyeDistSlider = document.getElementById('eyeDist');
        
        let mediaRecorder;
        let recordedChunks = [];

        const guavaImg = new Image();
        guavaImg.src = 'guava.png'; 

        navigator.mediaDevices.getUserMedia({ 
            video: { width: 640, height: 480 }, 
            audio: true 
        })
        .then(stream => {
            video.srcObject = stream;
            video.addEventListener('loadedmetadata', () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                drawFilter();
            });

            const canvasStream = canvas.captureStream(30); 
            const audioTracks = stream.getAudioTracks();
            if(audioTracks.length > 0) {
                canvasStream.addTrack(audioTracks);
            }

            mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp8,opus' });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'guava-video.webm';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };
        });

        // Forced direct pixel injection onto the fruit image layer
        function overlayWebcamCircle(sourceX, sourceY, radius, targetX, targetY) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(targetX, targetY, radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            
            // Copies the raw webcam feed and stamps it cleanly on top of the solid canvas
            ctx.drawImage(
                video, 
                sourceX - radius, sourceY - radius, radius * 2, radius * 2, 
                targetX - radius, targetY - radius, radius * 2, radius * 2
            );
            ctx.restore();
        }

        function drawFilter() {
            // LAYER 1: Draw clean, solid black canvas backdrop
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Fruit Dimensions
            const fruitW = 340;
            const fruitH = 340;
            const fruitX = (canvas.width / 2) - (fruitW / 2);
            const fruitY = (canvas.height / 2) - (fruitH / 2) + 20;

            // LAYER 2: Draw your guava image 100% solid. No holes or masks touch it.
            ctx.drawImage(guavaImg, fruitX, fruitY, fruitW, fruitH);

            // Fetch current manual calibration targets
            const userX = parseInt(faceXSlider.value);
            const userY = parseInt(faceYSlider.value);
            const userEyeGap = parseInt(eyeDistSlider.value);

            // LAYER 3: Stamp webcam layers on top of the solid image
            // Left Eye Stamp
            overlayWebcamCircle(userX - userEyeGap, userY - 30, 24, fruitX + 115, fruitY + 165);
            
            // Right Eye Stamp
            overlayWebcamCircle(userX + userEyeGap, userY - 30, 24, fruitX + 225, fruitY + 165);
            
            // Mouth Stamp
            overlayWebcamCircle(userX, userY + 55, 38, fruitX + 170, fruitY + 245);

            requestAnimationFrame(drawFilter);
        }

        startBtn.onclick = () => {
            recordedChunks = [];
            mediaRecorder.start();
            startBtn.disabled = true;
            stopBtn.disabled = false;
        };
        stopBtn.onclick = () => {
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
        };
    </script>
</body>
</html>
