<!DOCTYPE html>
<html>
<head>
    <title>Guava Filter Studio</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        #container { position: relative; width: 640px; height: 480px; margin: 20px auto; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        video, canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; }
        .controls { margin-top: 20px; }
        button { font-size: 16px; font-weight: bold; padding: 12px 24px; margin: 10px; cursor: pointer; border-radius: 6px; border: none; transition: 0.2s; }
        #start { background: #00ca71; color: white; }
        #start:disabled { background: #444; color: #888; cursor: not-allowed; }
        #stop { background: #ff3b30; color: white; }
        #stop:disabled { background: #444; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Guava Filter Studio</h1>
    <div id="container">
        <!-- Keep video feed completely invisible so your room background never shows -->
        <video id="webcam" autoplay playsinline muted style="display:none;"></video>
        <canvas id="output"></canvas>
    </div>
    <div class="controls">
        <button id="start">Record</button>
        <button id="stop" disabled>Stop Recording</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start');
        const stopBtn = document.getElementById('stop');
        
        let mediaRecorder;
        let recordedChunks = [];

        const guavaImg = new Image();
        guavaImg.src = 'guava.png'; 

        navigator.mediaDevices.getUserMedia({ 
            video: { width: 640, height: 480 }, 
            audio: true 
        })
        .then(stream => {
            video.srcObject = stream;
            video.addEventListener('loadedmetadata', () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                drawFilter();
            });

            const canvasStream = canvas.captureStream(30); 
            const audioTracks = stream.getAudioTracks();
            if(audioTracks.length > 0) {
                canvasStream.addTrack(audioTracks);
            }

            mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp8,opus' });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'guava-video.webm';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };
        })
        .catch(err => {
            console.error("Camera stream error handler:", err);
        });

        // Grabs your features out of the invisible camera feed and stamps them on the canvas
        function stampWebcamFeature(sourceX, sourceY, radius, targetX, targetY) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(targetX, targetY, radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            
            // Draw the precise circle snippet from your webcam onto the guava layer
            ctx.drawImage(
                video, 
                sourceX - radius, sourceY - radius, radius * 2, radius * 2, // Source box on face
                targetX - radius, targetY - radius, radius * 2, radius * 2  // Destination box on guava
            );
            ctx.restore();
        }

        function drawFilter() {
            // 1. Draw a solid clean black background (hides your room entirely)
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Guava Image Dimensions
            const maskW = 340;
            const maskH = 340;
            const maskX = (canvas.width / 2) - (maskW / 2);
            const maskY = (canvas.height / 2) - (maskH / 2) + 20;

            // 2. Render your solid, untouched guava image file
            ctx.drawImage(guavaImg, maskX, maskY, maskW, maskH);

            // 3. Coordinate Tracking Centers (Based on where you sit in front of the lens)
            const myFaceX = canvas.width / 2;
            const myFaceY = canvas.height / 2 - 15;

            // Stamp Left Eye over the guava body
            stampWebcamFeature(myFaceX - 45, myFaceY - 30, 24, maskX + 115, maskY + 165);
            
            // Stamp Right Eye over the guava body
            stampWebcamFeature(myFaceX + 45, myFaceY - 30, 24, maskX + 225, maskY + 165);
            
            // Stamp Mouth over the guava body
            stampWebcamFeature(myFaceX, myFaceY + 55, 36, maskX + 170, maskY + 245);

            requestAnimationFrame(drawFilter);
        }
    </script>
</body>
</html>
