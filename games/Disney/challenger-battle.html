<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gToons - Challenger Battle</title>
    <style>
        :root { 
            --p: #3b82f6; --s: #f59e0b; --bg: #0b0e14; 
            --red: #ef4444; --blue: #3b82f6; --green: #22c55e;
            --yellow: #eab308; --purple: #a855f7; --orange: #f97316;
            --pink: #ec4899; --cyan: #06b6d4; --silver: #94a3b8; --gold: #d97706;
        }
        
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        .nav { display: flex; justify-content: space-around; background: #000; padding: 12px; border-bottom: 2px solid var(--red); }
        .nav span { color: var(--red); font-weight: 900; letter-spacing: 2px; }

        .header { background: #000; padding: 10px; border-bottom: 1px solid #222; text-align: center; }
        .hud { display: flex; justify-content: space-around; font-weight: bold; margin-top: 5px; font-size: 1.1rem; }
        
        .arena { flex: 1; display: flex; justify-content: center; align-items: center; gap: 10px; padding: 10px; flex-wrap: wrap; }
        .circles-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: rgba(255,0,0,0.05); padding: 10px; border-radius: 20px; border: 1px solid var(--red); }
        .coin-slot { width: 65px; height: 65px; border-radius: 50%; border: 2px dashed #334155; display: flex; align-items: center; justify-content: center; perspective: 1000px; }
        
        .coin-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; }
        .revealed .coin-inner { transform: rotateY(180deg); }
        .coin-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px solid rgba(255,255,255,0.2); overflow: hidden; }
        .coin-front { background: radial-gradient(circle, #222, #000); color: var(--red); font-weight: 900; }
        .coin-back { transform: rotateY(180deg); }
        
        .c-pow { font-size: 1.2rem; font-weight: 900; z-index: 2; }
        .c-name { font-size: 0.4rem; font-weight: 800; text-transform: uppercase; z-index: 2; text-align: center; }

        .rainbow {
            background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 200% 200%;
            animation: rainbowFlow 3s linear infinite;
            color: white; text-shadow: 0 0 5px black;
        }
        @keyframes rainbowFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .red { background: var(--red); } .blue { background: var(--blue); } .green { background: var(--green); }
        .yellow { background: var(--yellow); color: #000; } .purple { background: var(--purple); }
        .orange { background: var(--orange); } .pink { background: var(--pink); }
        .cyan { background: var(--cyan); } .silver { background: var(--silver); }
        .gold { background: var(--gold); }

        .footer { background: #000; border-top: 2px solid var(--red); padding: 15px; min-height: 120px; }
        .hand { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; justify-content: center; flex-wrap: wrap; }
        .hand-coin { min-width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-weight: 900; cursor: pointer; font-size: 0.75rem; }
        .primary-btn { background: var(--red); color: white; border: none; padding: 12px 30px; border-radius: 30px; font-weight: 900; cursor: pointer; }
        
        #game-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    </style>
</head>
<body>

<div id="game-overlay">
    <h1 id="otitle" style="font-size: 3rem; margin: 0;"></h1>
    <p id="obody" style="white-space: pre-line; font-size: 1.1rem; margin: 20px 0;"></p>
    <button class="primary-btn" onclick="window.location.href='challengers.html'">RETURN TO LIST</button>
</div>

<div class="nav"><span>CHALLENGER BATTLE</span></div>

<div class="header">
    <div style="color:var(--s); font-weight: 900; font-size: 0.8rem;">TARGET ELEMENT: <span id="btarget">---</span></div>
    <div class="hud">
        <div style="color: var(--p);">YOU: <span id="p-score">0</span></div>
        <div id="round-txt" style="font-size: 0.7rem; opacity: 0.8;">BOSS FIGHT</div>
        <div style="color: var(--red);">BOSS: <span id="c-score">0</span></div>
    </div>
</div>

<div class="arena">
    <div class="circles-grid" id="cpu-board">
        <div class="coin-slot" id="cs0"></div><div class="coin-slot" id="cs1"></div><div class="coin-slot" id="cs2"></div><div class="coin-slot" id="cs3"></div>
        <div class="coin-slot" id="cs4"></div><div class="coin-slot" id="cs5"></div><div class="coin-slot" id="cs6"></div><div class="coin-slot" id="cs7"></div>
    </div>
    <div class="circles-grid" id="player-board">
        <div class="coin-slot" id="ps0"></div><div class="coin-slot" id="ps1"></div><div class="coin-slot" id="ps2"></div><div class="coin-slot" id="ps3"></div>
        <div class="coin-slot" id="ps4"></div><div class="coin-slot" id="ps5"></div><div class="coin-slot" id="ps6"></div><div class="coin-slot" id="ps7"></div>
    </div>
</div>

<div class="footer">
    <div class="hand" id="hand"></div>
    <center id="action-area"></center>
</div>

<script>
    const ALL_COLORS = ['red', 'blue', 'green', 'yellow', 'purple', 'orange', 'pink', 'cyan', 'silver', 'gold'];
    const TARGET_POOL = ['red', 'blue', 'green'];
    
    const chalIdx = localStorage.getItem('activeChallengerIndex');
    const challengers = JSON.parse(localStorage.getItem('gToonChallengers') || '[]');
    const activeBoss = challengers[chalIdx];

    let fullInventory = JSON.parse(localStorage.getItem('gToonCollection') || '[]');
    let inv = fullInventory.sort(() => 0.5 - Math.random()).slice(0, 12);
    const bColor = TARGET_POOL[Math.floor(Math.random() * 3)];
    document.getElementById('btarget').innerText = bColor.toUpperCase();

    // CPU DECK: 1 Boss Coin + 7 Randoms (Power 1-15)
    const cpuDeck = Array.from({length:8}, (_, i) => {
        if(i === 0) return activeBoss.reward; 
        return { 
            char: "Minion", 
            color: ALL_COLORS[Math.floor(Math.random()*10)], 
            power: Math.floor(Math.random()*15)+1 
        };
    });

    let picks = [];
    let round = 1, revealed = 0, pPts = 0, cPts = 0, isRevealingMode = false;
    const placementGoals = { 1: 4, 2: 8, 3: 8 };
    const revealGoals = { 1: 4, 2: 7, 3: 8 };

    function createCoinHTML(coin) {
        return `
            <div class="coin-inner">
                <div class="coin-face coin-front">?</div>
                <div class="coin-face coin-back ${coin.color}">
                    <div class="c-pow">${coin.power}</div>
                    <div class="c-name">${coin.char}</div>
                </div>
            </div>`;
    }

    function updateUI() {
        const hDiv = document.getElementById('hand');
        hDiv.innerHTML = "";
        if (!isRevealingMode) {
            inv.forEach((c, i) => {
                const d = document.createElement('div');
                d.className = `hand-coin ${c.color}`;
                d.innerHTML = c.power;
                d.onclick = () => { if(picks.length < placementGoals[round]) { picks.push(inv.splice(i,1)[0]); updateUI(); } };
                hDiv.appendChild(d);
            });
        }
        for(let i=0; i<8; i++) {
            const pSlot = document.getElementById(`ps${i}`);
            if(i >= revealed && picks[i]) {
                pSlot.innerHTML = createCoinHTML(picks[i]);
                pSlot.querySelector('.coin-inner').style.transform = "rotateY(180deg)";
            }
        }
        document.getElementById('action-area').innerHTML = `<button class="primary-btn" onclick="startReveal()" ${picks.length < placementGoals[round] ? 'disabled' : ''}>ENGAGE BOSS</button>`;
    }

    async function startReveal() {
        isRevealingMode = true; updateUI();
        const goal = revealGoals[round];
        for(let i = revealed; i < goal; i++) {
            const ps = document.getElementById(`ps${i}`), cs = document.getElementById(`cs${i}`);
            ps.innerHTML = createCoinHTML(picks[i]);
            cs.innerHTML = createCoinHTML(cpuDeck[i]);
            ps.classList.add('revealed'); await new Promise(r => setTimeout(r, 1000));
            cs.classList.add('revealed'); await new Promise(r => setTimeout(r, 1000));
            pPts += picks[i].power; cPts += cpuDeck[i].power;
            document.getElementById('p-score').innerText = pPts;
            document.getElementById('c-score').innerText = cPts;
            revealed++;
        }
        if(round < 3) { round++; isRevealingMode = false; updateUI(); } else { finish(); }
    }

    function finish() {
        const pMaj = picks.filter(c => c.color === bColor).length;
        const cMaj = cpuDeck.filter(c => c.color === bColor).length;
        let finalP = pPts + (pMaj > cMaj ? 15 : 0);
        let finalC = cPts + (cMaj > pMaj ? 15 : 0);
        
        const win = finalP > finalC;
        
        // UPDATE STORAGE: Add reward if won, ALWAYS remove challenger
        if(win) {
            fullInventory.push(activeBoss.reward);
            localStorage.setItem('gToonCollection', JSON.stringify(fullInventory));
        }

        challengers.splice(chalIdx, 1);
        localStorage.setItem('gToonChallengers', JSON.stringify(challengers));

        document.getElementById('game-overlay').style.display = "flex";
        const t = document.getElementById('otitle');
        t.innerText = win ? "VICTORY!" : "DEFEATED";
        t.style.color = win ? "var(--s)" : "var(--red)";
        
        document.getElementById('obody').innerText = win 
            ? `You conquered the Guardian and earned the Rainbow Coin!\nIt has been added to your collection.`
            : `You lost the battle. The Guardian has vanished,\nand their Rainbow Coin is lost... for now.`;
    }

    updateUI();
</script>
</body>
</html>
