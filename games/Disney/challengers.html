<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gToons - Challengers</title>
    <style>
        :root { --p: #3b82f6; --s: #f59e0b; --bg: #0b0e14; --red: #ef4444; }
        body { background: var(--bg); color: white; font-family: sans-serif; text-align: center; margin:0; }
        .nav { display: flex; justify-content: space-around; background: #000; padding: 15px; border-bottom: 2px solid var(--p); }
        .nav a { color: white; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        
        .list-container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .challenger-card { 
            background: #1e293b; border-radius: 15px; padding: 15px; 
            border: 1px solid #334155; cursor: pointer; transition: 0.3s;
        }
        
        .rainbow-coin {
            width: 60px; height: 60px; border-radius: 50%; margin: 10px auto;
            background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 200% 200%; animation: rainbowFlow 3s linear infinite;
            display: flex; align-items: center; justify-content: center; font-weight: 900;
        }
        @keyframes rainbowFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* PREVIEW OVERLAY */
        #preview-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 1000; flex-direction: column; align-items: center; justify-content: center;
        }
        .modal-content { background: #111; padding: 30px; border: 2px solid var(--s); border-radius: 20px; max-width: 80%; }
        .btn-row { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
        .btn { padding: 10px 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-go { background: var(--s); color: black; }
        .btn-cancel { background: #333; color: white; }
    </style>
</head>
<body>
    <div id="preview-modal">
        <div class="modal-content">
            <h2 id="modal-name">CHALLENGER</h2>
            <p>Ready to battle for the Rainbow Coin?</p>
            <p style="color: var(--red); font-size: 0.8rem; font-weight: bold;">⚠️ WARNING: You only get ONE CHANCE.<br>If you lose, the challenger disappears!</p>
            <div class="btn-row">
                <button class="btn btn-cancel" onclick="closeModal()">BACK</button>
                <button class="btn btn-go" onclick="startBattle()">BATTLE!</button>
            </div>
        </div>
    </div>

    <div class="nav">
        <a href="collect.html">SCANNER</a>
        <a href="challengers.html" style="color:var(--s)">CHALLENGERS</a>
        <a href="battle.html">BATTLE</a>
    </div>

    <h2>AVAILABLE CHALLENGERS</h2>
    <div id="list" class="list-container"></div>

    <script>
        let selectedIdx = null;

        function loadChallengers() {
            const list = document.getElementById('list');
            const data = JSON.parse(localStorage.getItem('gToonChallengers') || '[]');
            list.innerHTML = data.length === 0 ? "<p style='opacity:0.5'>No challengers. Go scan rides!</p>" :
                data.map((c, i) => `
                    <div class="challenger-card" onclick="openModal(${i})">
                        <div class="rainbow-coin">?</div>
                        <div style="font-size:0.8rem; font-weight:bold">${c.name}</div>
                    </div>
                `).join('');
        }

        function openModal(index) {
            const data = JSON.parse(localStorage.getItem('gToonChallengers') || '[]');
            selectedIdx = index;
            document.getElementById('modal-name').innerText = data[index].name;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('preview-modal').style.display = 'none'; }

        function startBattle() {
            localStorage.setItem('activeChallengerIndex', selectedIdx);
            window.location.href = "challenger-battle.html";
        }

        loadChallengers();
    </script>
</body>
</html>
