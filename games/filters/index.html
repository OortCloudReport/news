<!DOCTYPE html>
<html>
<head>
    <title>My Custom Guava Filter Recorder</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        #container { position: relative; width: 640px; height: 480px; margin: 20px auto; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        video, canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; transform: scaleX(-1); }
        .controls { margin-top: 20px; }
        button { font-size: 16px; font-weight: bold; padding: 12px 24px; margin: 10px; cursor: pointer; border-radius: 6px; border: none; transition: 0.2s; }
        #start { background: #00ca71; color: white; }
        #start:disabled { background: #444; color: #888; cursor: not-allowed; }
        #stop { background: #ff3b30; color: white; }
        #stop:disabled { background: #444; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Guava Filter Studio</h1>
    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output"></canvas>
    </div>
    <div class="controls">
        <button id="start">Record</button>
        <button id="stop" disabled>Stop Recording</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start');
        const stopBtn = document.getElementById('stop');
        
        let mediaRecorder;
        let recordedChunks = [];

        // Pulls your local image file from the exact same folder
        const guavaImg = new Image();
        guavaImg.src = 'guava.png'; 

        // Start WebCam with fallback routing
        navigator.mediaDevices.getUserMedia({ 
            video: { width: 640, height: 480 }, 
            audio: true 
        })
        .then(stream => {
            video.srcObject = stream;
            video.addEventListener('loadedmetadata', () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                drawFilter();
            });

            // Handle combined stream capture
            const canvasStream = canvas.captureStream(30); 
            const audioTracks = stream.getAudioTracks();
            if(audioTracks.length > 0) {
                canvasStream.addTrack(audioTracks[0]);
            }

            mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp8,opus' });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'guava-performance.webm';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };
        })
        .catch(err => {
            alert("Camera Blocked! Please use the Python terminal command approach to allow camera permissions.");
            console.error(err);
        });

        // Math layout to slice eye/mouth holes out of your guava.png file
        function drawFilter() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Draw the background video feed first
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // 2. Set up mask positioning parameters
            const maskW = 320;
            const maskH = 320;
            const maskX = (canvas.width / 2) - (maskW / 2);
            const maskY = (canvas.height / 2) - (maskH / 2);

            // 3. Save state to cut holes through your guava.png asset
            ctx.save();
            
            // Left Eye Hole Path
            ctx.beginPath(); ctx.arc(maskX + 110, maskY + 130, 25, 0, Math.PI * 2); 
            // Right Eye Hole Path
            ctx.arc(maskX + 210, maskY + 130, 25, 0, Math.PI * 2); 
            // Mouth Hole Path
            ctx.arc(maskX + 160, maskY + 220, 35, 0, Math.PI * 2); 
            ctx.closePath();
            
            // Clip away these spaces so your real face shows through them
            ctx.clip();
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            // 4. Draw the actual guava body framework over everything else
            ctx.save();
            ctx.beginPath();
            ctx.arc(maskX + 110, maskY + 130, 25, 0, Math.PI * 2); 
            ctx.arc(maskX + 210, maskY + 130, 25, 0, Math.PI * 2); 
            ctx.arc(maskX + 160, maskY + 220, 35, 0, Math.PI * 2); 
            ctx.closePath();
            
            // Inverse clipping context layout
            ctx.clip();
            ctx.clearRect(maskX, maskY, maskW, maskH);
            ctx.restore();
            
            // Draw the graphic layer inside the canvas stack loop
            ctx.globalCompositeOperation = 'destination-over';
            ctx.drawImage(guavaImg, maskX, maskY, maskW, maskH);
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(drawFilter);
        }

        startBtn.onclick = () => {
            recordedChunks = [];
            mediaRecorder.start();
            startBtn.disabled = true;
            stopBtn.disabled = false;
        };
        stopBtn.onclick = () => {
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
        };
    </script>
</body>
</html>
