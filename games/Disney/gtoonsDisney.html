<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical gToons: CPU Match</title>
    <style>
        :root { --p: #4a90e2; --s: #f39c12; --bg: #1a1a2e; --card-bg: #16213e; --admin: #e74c3c; --win: #2ecc71; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; text-align: center; margin: 0; padding: 10px; }
        
        .section { padding: 20px; border-radius: 15px; background: var(--card-bg); margin-bottom: 20px; border: 1px solid #333; }
        button { padding: 12px 24px; border-radius: 8px; border: none; background: var(--p); color: white; font-weight: bold; cursor: pointer; margin: 5px; }
        
        /* Stats Header */
        .stats-bar { display: flex; justify-content: space-around; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; margin-bottom: 15px; font-weight: bold; border-left: 5px solid var(--s); }

        /* Admin Controls */
        .admin-panel { background: #2c3e50; border: 2px dashed var(--admin); padding: 15px; margin-bottom: 20px; border-radius: 15px; }

        /* Card Styles */
        .inventory-flex { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 15px; min-height: 130px; border: 1px solid #333; padding: 10px; border-radius: 10px; }
        .card { width: 85px; height: 125px; background: #333; border: 3px solid white; border-radius: 10px; padding: 5px; font-size: 0.75rem; position: relative; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .card.blue { border-color: #3498db; }
        .card.red { border-color: #e74c3c; }
        .card.green { border-color: #2ecc71; }
        .points { position: absolute; top: 5px; right: 5px; font-weight: bold; background: rgba(0,0,0,0.8); color: white; padding: 2px 6px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); }

        .board { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .slot { height: 140px; border: 2px dashed #444; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); }
        #status { color: var(--s); font-weight: bold; margin: 10px 0; height: 20px; }
    </style>
</head>
<body>

    <h1>🏰 Disney gToons Battle</h1>

    <div class="stats-bar">
        <span>Player Score: <span id="p-total">0</span></span>
        <span>Round: <span id="round-num">1</span>/8</span>
        <span>CPU Score: <span id="c-total">0</span></span>
    </div>

    <div id="status">Prepare for Battle!</div>

    <div class="admin-panel">
        <span style="font-size: 0.7rem; color: var(--admin);">TEST TOOLS:</span>
        <button onclick="adminAddCard(0)">+ Space</button>
        <button onclick="adminAddCard(1)">+ Haunted</button>
        <button onclick="adminAddCard(2)">+ Pirates</button>
        <button onclick="resetGame()" style="background:#555">New Match</button>
    </div>

    <div class="section">
        <div class="board">
            <div>
                <p>💻 CPU DECK</p>
                <div class="slot" id="op-slot">
                    <div class="card" style="background:#222; border-color:#444">?</div>
                </div>
            </div>
            <div>
                <p>👤 YOUR PLAY</p>
                <div id="player-slot" class="slot">Select a Card</div>
            </div>
        </div>
        <button id="fight-btn" onclick="runRound()" style="background: var(--win); width: 100%; font-size: 1.2rem;">PLAY CARD</button>
        <h2 id="result-text"></h2>
    </div>

    <div class="section">
        <h3>🎒 Your Collection</h3>
        <div class="inventory-flex" id="inventory-list"></div>
        <button onclick="checkLocation()" style="margin-top:10px; font-size: 0.8rem; background: #444;">📍 GPS Scan (Actual Park Only)</button>
    </div>

<script>
    const CHARACTERS = [
        { name: "Space Mountain", char: "Astro Boy", color: "blue", power: 15 },
        { name: "Haunted Mansion", char: "Ghost Host", color: "red", power: 12 },
        { name: "Pirates", char: "Captain Jack", color: "green", power: 14 },
        { name: "Matterhorn", char: "Yeti", color: "blue", power: 18 },
        { name: "Small World", char: "Clock Tower", color: "green", power: 8 }
    ];

    let inventory = [];
    let cpuDeck = [];
    let playerCard = null;
    let playerScore = 0;
    let cpuScore = 0;
    let round = 1;

    // Initialize Game
    function initCPU() {
        cpuDeck = [];
        for(let i=0; i<8; i++) {
            cpuDeck.push(CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)]);
        }
    }

    function resetGame() {
        playerScore = 0;
        cpuScore = 0;
        round = 1;
        playerCard = null;
        updateUI();
        initCPU();
        document.getElementById('player-slot').innerText = "Select a Card";
        document.getElementById('op-slot').innerHTML = '<div class="card" style="background:#222; border-color:#444">?</div>';
        document.getElementById('result-text').innerText = "";
        document.getElementById('status').innerText = "New match started!";
    }

    // Admin & GPS
    function adminAddCard(i) {
        inventory.push({...CHARACTERS[i]});
        renderInventory();
    }

    function renderInventory() {
        const list = document.getElementById('inventory-list');
        list.innerHTML = "";
        inventory.forEach((card, idx) => {
            const div = document.createElement('div');
            div.className = `card ${card.color}`;
            div.innerHTML = `<span class="points">${card.power}</span><br><strong>${card.char}</strong><br><small>${card.name}</small>`;
            div.onclick = () => { playerCard = card; renderPlayerSlot(); };
            list.appendChild(div);
        });
    }

    function renderPlayerSlot() {
        document.getElementById('player-slot').innerHTML = `
            <div class="card ${playerCard.color}">
                <span class="points">${playerCard.power}</span><br><strong>${playerCard.char}</strong>
            </div>`;
    }

    // The Battle Logic
    function runRound() {
        if (!playerCard) return alert("Pick a card from your collection first!");
        if (round > 8) return alert("Match finished! Click New Match.");

        // Draw CPU Card
        const cpuCard = cpuDeck[round-1];
        document.getElementById('op-slot').innerHTML = `
            <div class="card ${cpuCard.color}">
                <span class="points">${cpuCard.power}</span><br><strong>${cpuCard.char}</strong>
            </div>`;

        let pP = playerCard.power;
        let cP = cpuCard.power;

        // gToons Color Bonus Logic
        if (playerCard.color === cpuCard.color) {
            pP += 5; cP += 5;
            document.getElementById('status').innerText = "🌈 COLOR MATCH! +5 Bonus!";
        } else {
            document.getElementById('status').innerText = "";
        }

        playerScore += pP;
        cpuScore += cP;
        
        const roundWinner = pP > cP ? "Round Win!" : pP < cP ? "Round Loss..." : "Draw";
        document.getElementById('result-text').innerText = roundWinner;
        
        round++;
        updateUI();
        playerCard = null; // Reset for next round
        
        if (round > 8) {
            const final = playerScore > cpuScore ? "🏆 YOU WIN THE MATCH!" : "💀 CPU WINS THE MATCH";
            document.getElementById('status').innerText = "GAME OVER";
            alert(final);
        }
    }

    function updateUI() {
        document.getElementById('p-total').innerText = playerScore;
        document.getElementById('c-total').innerText = cpuScore;
        document.getElementById('round-num').innerText = Math.min(round, 8);
    }

    // Start everything
    initCPU();
    updateUI();
</script>

</body>
</html>
